# Publishes the playable game to GitHub Pages on every push to main.
# Only index.html and the game's images go up: no docs, no walkthrough, no source.
# One-time setup: repo Settings > Pages > Source: GitHub Actions.
name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python3 build.py
      - name: Collect the playable files
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          find assets -maxdepth 1 -type f \( -name '*.webp' -o -name '*.jpg' -o -name '*.png' -o -name '*.svg' \) -exec cp {} _site/assets/ \;
          touch _site/.nojekyll
          ls _site _site/assets | head -100
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
