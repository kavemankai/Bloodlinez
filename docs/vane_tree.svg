<path d="M325 273.0 V327.0" class="ed"/><path d="M325 393.0 V457.0" class="ed"/><path d="M208.0 490 H227.0" class="ed"/><path d="M217.5 490 V543.5 H325 V597.0" class="ed"/><path d="M928.0 490 H952.0" class="ed"/><path d="M940.0 490 V543.5 H940 V597.0" class="ed"/><path d="M423.0 630 H842.0" class="ed"/><path d="M632.5 630 V688.5 H632 V747.0" class="ed"/><path d="M730.0 780 H864.0" class="ed"/><path d="M797.0 780 V833.5 H797 V887.0" class="ed"/><path d="M797 953.0 V1037.0" class="ed"/><path d="M325 663.0 V725 H170 V747.0" class="ed red"/><text x="248" y="718" text-anchor="middle" class="lb" fill="#c0392b">registered 1934, mother left blank</text><path d="M170 813.0 V887.0" class="ed red"/><text x="170" y="854" text-anchor="middle" class="lb" fill="#c0392b">no birth record anywhere</text><path d="M170 953.0 V1037.0" class="ed red"/><text x="170" y="1002" text-anchor="middle" class="lb" fill="#c0392b">home birth, informant C. Vane</text><path d="M268.0 780 H440 V887.0" class="ed amber"/><text x="330" y="772" text-anchor="middle" class="lb" fill="#b07d2b">claimed</text><text x="440" y="982" text-anchor="middle" class="lb" fill="#b07d2b">DNA: Marsh side only</text><path d="M227.0 630 H30 V1070 H72.0" class="ed id"/><path d="M30 780 H72.0" class="ed id"/><text x="22" y="850.0" transform="rotate(-90 22 850.0)" text-anchor="middle" class="lb" fill="#8a1c2b">same man: scar through the left eyebrow, mole on the right cheek</text><rect x="225" y="20" width="200" height="86" rx="9" fill="#f1ece0" stroke="#8a7f6d" stroke-width="1.6" stroke-dasharray="2 4"/><text x="325" y="44" text-anchor="middle" class="nm">Ten earlier generations</text><text x="325" y="62" text-anchor="middle" class="yr">Hugh atte Vane, b. c.1410</text><text x="325" y="78" text-anchor="middle" class="yr">to John Vane, b. 1720</text><text x="325" y="95" text-anchor="middle" class="sb">boatmen, then coopers</text><path d="M325 106 V207.0" class="ed"/><path d="M560 62 H1300" class="ed amber" style="stroke-width:2.5"/><circle cx="560" cy="62" r="7" fill="#fff" stroke="#b07d2b" stroke-width="2.5"/><text x="560" y="44" text-anchor="middle" class="nm" style="font-size:13px">1436</text><text x="560" y="88" text-anchor="middle" class="sb">court roll</text><circle cx="652" cy="62" r="7" fill="#fff" stroke="#b07d2b" stroke-width="2.5"/><text x="652" y="44" text-anchor="middle" class="nm" style="font-size:13px">1509</text><text x="652" y="88" text-anchor="middle" class="sb">will</text><circle cx="745" cy="62" r="7" fill="#fff" stroke="#b07d2b" stroke-width="2.5"/><text x="745" y="44" text-anchor="middle" class="nm" style="font-size:13px">1577</text><text x="745" y="88" text-anchor="middle" class="sb">will</text><circle cx="838" cy="62" r="7" fill="#fff" stroke="#b07d2b" stroke-width="2.5"/><text x="838" y="44" text-anchor="middle" class="nm" style="font-size:13px">1620</text><text x="838" y="88" text-anchor="middle" class="sb">portrait</text><circle cx="930" cy="62" r="7" fill="#fff" stroke="#b07d2b" stroke-width="2.5"/><text x="930" y="44" text-anchor="middle" class="nm" style="font-size:13px">1740</text><text x="930" y="88" text-anchor="middle" class="sb">lease</text><circle cx="1022" cy="62" r="7" fill="#fff" stroke="#b07d2b" stroke-width="2.5"/><text x="1022" y="44" text-anchor="middle" class="nm" style="font-size:13px">1886</text><text x="1022" y="88" text-anchor="middle" class="sb">marriage</text><circle cx="1115" cy="62" r="7" fill="#fff" stroke="#b07d2b" stroke-width="2.5"/><text x="1115" y="44" text-anchor="middle" class="nm" style="font-size:13px">1912</text><text x="1115" y="88" text-anchor="middle" class="sb">wedding</text><circle cx="1208" cy="62" r="7" fill="#fff" stroke="#b07d2b" stroke-width="2.5"/><text x="1208" y="44" text-anchor="middle" class="nm" style="font-size:13px">1921</text><text x="1208" y="88" text-anchor="middle" class="sb">census</text><circle cx="1300" cy="62" r="7" fill="#fff" stroke="#b07d2b" stroke-width="2.5"/><text x="1300" y="44" text-anchor="middle" class="nm" style="font-size:13px">1934</text><text x="1300" y="88" text-anchor="middle" class="sb">trust deed</text><text x="930" y="110" text-anchor="middle" class="nm" style="font-size:14px;fill:#8a5a00">R. Ashgrove: clerk, scrivener, notary, recorder, lessor, solicitor</text><text x="930" y="128" text-anchor="middle" class="sb" style="font-size:12px">Older than the oldest record. Looks about 33 in the 1620 portrait. The "tall foreign gentleman" of 1888.</text><rect x="227.0" y="207.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="325" y="228" text-anchor="middle" class="nm">Samuel Vane</text><text x="325" y="245" text-anchor="middle" class="yr">1751 – 1822</text><text x="325" y="261" text-anchor="middle" class="sb">cooper</text><rect x="227.0" y="327.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="325" y="348" text-anchor="middle" class="nm">Thomas Vane</text><text x="325" y="365" text-anchor="middle" class="yr">1789 – 1858</text><text x="325" y="381" text-anchor="middle" class="sb">cooper</text><rect x="12.0" y="457.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="110" y="478" text-anchor="middle" class="nm">Hannah Crewe</text><text x="110" y="495" text-anchor="middle" class="yr">1828 – 1901</text><rect x="227.0" y="457.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="325" y="478" text-anchor="middle" class="nm">Josiah Vane</text><text x="325" y="495" text-anchor="middle" class="yr">1824 – 1889</text><text x="325" y="511" text-anchor="middle" class="sb">shipwright</text><rect x="732.0" y="457.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="830" y="478" text-anchor="middle" class="nm">William Marsh</text><text x="830" y="495" text-anchor="middle" class="yr">1830 – 1899</text><text x="830" y="511" text-anchor="middle" class="sb">chandler</text><rect x="952.0" y="457.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="1050" y="478" text-anchor="middle" class="nm">Ann Teale</text><text x="1050" y="495" text-anchor="middle" class="yr">1832 – 1910</text><rect x="227.0" y="597.0" width="196" height="66" rx="9" fill="#f4e3e3" stroke="#8a1c2b" stroke-width="2.4"/><text x="325" y="618" text-anchor="middle" class="nm">Ambrose Vane</text><text x="325" y="635" text-anchor="middle" class="yr">1857 – 1934</text><text x="325" y="651" text-anchor="middle" class="sb">turned 14 Feb 1888 · "lost at sea" 1934</text><rect x="842.0" y="597.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="940" y="618" text-anchor="middle" class="nm">Eliza Marsh</text><text x="940" y="635" text-anchor="middle" class="yr">1861 – 1902</text><rect x="534.0" y="747.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="632" y="768" text-anchor="middle" class="nm">Harriet Vane</text><text x="632" y="785" text-anchor="middle" class="yr">1888 – 1960</text><text x="632" y="801" text-anchor="middle" class="sb">conceived before the turning</text><rect x="864.0" y="747.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="962" y="768" text-anchor="middle" class="nm">Arthur Holloway</text><text x="962" y="785" text-anchor="middle" class="yr">1884 – 1951</text><text x="962" y="801" text-anchor="middle" class="sb">ship's chandler</text><rect x="72.0" y="747.0" width="196" height="66" rx="9" fill="#f4e3e3" stroke="#8a1c2b" stroke-width="2.4"/><text x="170" y="768" text-anchor="middle" class="nm">Cornelius Vane</text><text x="170" y="785" text-anchor="middle" class="yr">"1934 – 2025"</text><text x="170" y="801" text-anchor="middle" class="sb">Ambrose under a new name</text><rect x="699.0" y="887.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="797" y="908" text-anchor="middle" class="nm">Thomas Holloway</text><text x="797" y="925" text-anchor="middle" class="yr">1920 – 1999</text><text x="797" y="941" text-anchor="middle" class="sb">mole, no scar</text><rect x="72.0" y="887.0" width="196" height="66" rx="9" fill="#fbe9e9" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="170" y="908" text-anchor="middle" class="nm">Desmond Vane</text><text x="170" y="925" text-anchor="middle" class="yr">"1961 – 1994"</text><text x="170" y="941" text-anchor="middle" class="sb">never existed</text><rect x="342.0" y="887.0" width="196" height="66" rx="9" fill="#fdf1d8" stroke="#b07d2b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="440" y="908" text-anchor="middle" class="nm">Daphne Marsh-Pike</text><text x="440" y="925" text-anchor="middle" class="yr">1966 – living</text><text x="440" y="941" text-anchor="middle" class="sb">claims to be his daughter</text><rect x="699.0" y="1037.0" width="196" height="66" rx="9" fill="#e6f2e8" stroke="#2d7d46" stroke-width="2.4"/><text x="797" y="1058" text-anchor="middle" class="nm">Margaret Holloway</text><text x="797" y="1075" text-anchor="middle" class="yr">1951 – living</text><text x="797" y="1091" text-anchor="middle" class="sb">takes the estate (Accord Art. 4)</text><rect x="72.0" y="1037.0" width="196" height="66" rx="9" fill="#f4e3e3" stroke="#8a1c2b" stroke-width="2.4"/><text x="170" y="1058" text-anchor="middle" class="nm">Julian Vane</text><text x="170" y="1075" text-anchor="middle" class="yr">"1993 – living"</text><text x="170" y="1091" text-anchor="middle" class="sb">Ambrose under a third name</text><g transform="translate(1010,890)"><rect width="320" height="250" rx="10" fill="#fff" stroke="#d8d2c6"/>
