xt><text x="325" y="191" text-anchor="middle" class="sb">cooper</text><rect x="12.0" y="267.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="110" y="288" text-anchor="middle" class="nm">Hannah Crewe</text><text x="110" y="305" text-anchor="middle" class="yr">1828 – 1901</text><rect x="227.0" y="267.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="325" y="288" text-anchor="middle" class="nm">Josiah Vane</text><text x="325" y="305" text-anchor="middle" class="yr">1824 – 1889</text><text x="325" y="321" text-anchor="middle" class="sb">shipwright</text><rect x="732.0" y="267.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="830" y="288" text-anchor="middle" class="nm">William Marsh</text><text x="830" y="305" text-anchor="middle" class="yr">1830 – 1899</text><text x="830" y="321" text-anchor="middle" class="sb">chandler</text><rect x="952.0" y="267.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="1050" y="288" text-anchor="middle" class="nm">Ann Teale</text><text x="1050" y="305" text-anchor="middle" class="yr">1832 – 1910</text><rect x="227.0" y="407.0" width="196" height="66" rx="9" fill="#f4e3e3" stroke="#8a1c2b" stroke-width="2.4"/><text x="325" y="428" text-anchor="middle" class="nm">Ambrose Vane</text><text x="325" y="445" text-anchor="middle" class="yr">1857 – 1934</text><text x="325" y="461" text-anchor="middle" class="sb">turned 14 Feb 1888 · "lost at sea" 1934</text><rect x="842.0" y="407.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="940" y="428" text-anchor="middle" class="nm">Eliza Marsh</text><text x="940" y="445" text-anchor="middle" class="yr">1861 – 1902</text><rect x="534.0" y="557.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="632" y="578" text-anchor="middle" class="nm">Harriet Vane</text><text x="632" y="595" text-anchor="middle" class="yr">1888 – 1960</text><text x="632" y="611" text-anchor="middle" class="sb">conceived before the turning</text><rect x="864.0" y="557.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="962" y="578" text-anchor="middle" class="nm">Arthur Holloway</text><text x="962" y="595" text-anchor="middle" class="yr">1884 – 1951</text><text x="962" y="611" text-anchor="middle" class="sb">ship's chandler</text><rect x="72.0" y="557.0" width="196" height="66" rx="9" fill="#f4e3e3" stroke="#8a1c2b" stroke-width="2.4"/><text x="170" y="578" text-anchor="middle" class="nm">Cornelius Vane</text><text x="170" y="595" text-anchor="middle" class="yr">"1934 – 2025"</text><text x="170" y="611" text-anchor="middle" class="sb">Ambrose under a new name</text><rect x="699.0" y="697.0" width="196" height="66" rx="9" fill="#fbf7ef" stroke="#8a7f6d" stroke-width="1.6"/><text x="797" y="718" text-anchor="middle" class="nm">Thomas Holloway</text><text x="797" y="735" text-anchor="middle" class="yr">1920 – 1999</text><text x="797" y="751" text-anchor="middle" class="sb">mole, no scar</text><rect x="72.0" y="697.0" width="196" height="66" rx="9" fill="#fbe9e9" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="170" y="718" text-anchor="middle" class="nm">Desmond Vane</text><text x="170" y="735" text-anchor="middle" class="yr">"1961 – 1994"</text><text x="170" y="751" text-anchor="middle" class="sb">never existed</text><rect x="342.0" y="697.0" width="196" height="66" rx="9" fill="#fdf1d8" stroke="#b07d2b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="440" y="718" text-anchor="middle" class="nm">Daphne Marsh-Pike</text><text x="440" y="735" text-anchor="middle" class="yr">1966 – living</text><text x="440" y="751" text-anchor="middle" class="sb">claims to be his daughter</text><rect x="699.0" y="847.0" width="196" height="66" rx="9" fill="#e6f2e8" stroke="#2d7d46" stroke-width="2.4"/><text x="797" y="868" text-anchor="middle" class="nm">Margaret Holloway</text><text x="797" y="885" text-anchor="middle" class="yr">1951 – living</text><text x="797" y="901" text-anchor="middle" class="sb">takes the estate (Accord Art. 4)</text><rect x="72.0" y="847.0" width="196" height="66" rx="9" fill="#f4e3e3" stroke="#8a1c2b" stroke-width="2.4"/><text x="170" y="868" text-anchor="middle" class="nm">Julian Vane</text><text x="170" y="885" text-anchor="middle" class="yr">"1993 – living"</text><text x="170" y="901" text-anchor="middle" class="sb">Ambrose under a third name</text><g transform="translate(1010,700)"><rect width="320" height="250" rx="10" fill="#fff" stroke="#d8d2c6"/>
